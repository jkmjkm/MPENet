name: MPENet
model_type: VideoRecurrentModel
scale: 2
num_gpu: auto  # set num_gpu: 0 for cpu mode
manual_seed: 0

datasets:
  test:
    name: FY
    type: SimpleVideoRecurrentTestDataset
    dataroot_gt: D:\FY_dataset_making\sequence_data\Sequence_Dataset\test\GT
    dataroot_lq: D:\FY_dataset_making\sequence_data\Sequence_Dataset\test\LR

    cache_data: true
    io_backend:
      type: disk

    num_frame: -1  # not needed


# network structures
network_g:
  type: MPENet
  mid_channels: 64
  num_blocks: 7
  is_low_res_input: true
  spynet_path: experiments/pretrained_models/flownet/spynet_sintel_final-3d2a1287.pth

# path
path:
  pretrain_network_g: experiments/pretrained_models/MPENet/net_g_145000.pth
  strict_load_g: true

# validation settings
val:
  save_img: true
  suffix: ~  # add suffix to saved images, if None, use exp name

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
